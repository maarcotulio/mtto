<script>
(function () {
  try {
    var stored = localStorage.getItem("mtto-mode");
    var mode = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : document.documentElement.getAttribute("data-mode"));
    document.documentElement.setAttribute("data-mode", mode);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Shippori+Mincho+B1:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#EFE9DC; --papel-alto:#F7F3EA; --sumi:#17140F; --tinta-md:#4A443C;
    --tinta-fraca:#857D71; --linha:#D6CDBB; --carimbo:#A6392F; --ocre:#8A7457;
  }
  html[data-mode="dark"]{
    --papel:#131110; --papel-alto:#1B1815; --sumi:#E8E1D4; --tinta-md:#A8A093;
    --tinta-fraca:#6E675D; --linha:#2E2A25; --carimbo:#C4483A; --ocre:#A08A66;
  }
  html,body{margin:0;padding:0;background:var(--papel);}
  *{box-sizing:border-box;}
  a{color:var(--sumi);text-decoration:none;}
  a:hover{color:var(--carimbo);}
  a:visited{color:var(--ocre);}
  :focus-visible{outline:2px solid var(--carimbo);outline-offset:3px;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition-duration:0.01ms !important;}
  }
  .mtto-nav-btn{font:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:none;padding:0;cursor:pointer;color:var(--tinta-fraca);}
  .mtto-mode-btn{border:1px solid var(--linha);border-radius:0;padding:0.3rem 0.6rem;}
  .mtto-underline{clip-path:inset(0 100% 0 0);transition:clip-path 350ms cubic-bezier(.4,0,.2,1);}
  .mtto-post:hover .mtto-underline{clip-path:inset(0 0 0 0);}
  .mtto-tag{transition:all 160ms ease-out;}
  .mtto-tag:hover{background:var(--carimbo);color:var(--papel);transform:translate(-1px,-1px) rotate(-1deg);}

  /* Article typography */
  .mtto-article{font-size:20px;line-height:1.8;color:var(--tinta-md);}
  .mtto-article > *:first-child{margin-top:0;}
  .mtto-article p{margin:1.3em 0;text-wrap:pretty;}
  .mtto-article :is(h1,h2,h3,h4,h5,h6){position:relative;font-family:'Shippori Mincho B1',serif;font-weight:600;color:var(--sumi);line-height:1.3;text-wrap:balance;}
  .mtto-article h2{font-size:1.6rem;margin:2.4em 0 0.9em;}
  .mtto-article h3{font-size:1.3rem;margin:2em 0 0.7em;}
  .mtto-article h4{font-size:1.1rem;margin:1.8em 0 0.6em;}
  .mtto-article :is(h1,h2,h3,h4,h5,h6) > span{position:absolute;top:0.15em;inset-inline-start:-1.4em;opacity:0;transition:opacity 150ms ease-out;font-family:'IBM Plex Mono',monospace;font-size:0.75em;}
  .mtto-article :is(h1,h2,h3,h4,h5,h6):hover > span{opacity:1;}
  .mtto-article :is(h1,h2,h3,h4,h5,h6) > span a{color:var(--tinta-fraca);text-decoration:none;}
  .mtto-article :is(h1,h2,h3,h4,h5,h6) .anchor{scroll-margin-top:2rem;}
  .mtto-article a{color:var(--carimbo);text-decoration:underline;text-decoration-color:var(--ocre);text-underline-offset:3px;}
  .mtto-article a:hover{text-decoration-color:var(--carimbo);}
  .mtto-article strong{color:var(--sumi);font-weight:600;}
  .mtto-article ul,.mtto-article ol{margin:1.3em 0;padding-inline-start:1.4em;}
  .mtto-article li{margin:0.45em 0;}
  .mtto-article blockquote{margin:1.8em 0;padding:0.1em 0 0.1em 1.2em;border-inline-start:3px solid var(--carimbo);color:var(--tinta-md);font-style:italic;}
  .mtto-article code{font-family:'IBM Plex Mono',monospace;font-size:0.82em;background:var(--papel-alto);padding:0.15em 0.4em;border-radius:3px;color:var(--carimbo);}
  .mtto-article .highlight-wrapper{margin:1.8em 0;border:1px solid var(--linha);border-radius:4px;overflow:auto;}
  .mtto-article .highlight-wrapper pre{margin:0;padding:1em 1.2em;}
  .mtto-article .highlight-wrapper code{background:none;padding:0;border-radius:0;color:inherit;font-size:0.85em;}
  .mtto-article .codeblock-title{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--tinta-fraca);padding:0.6em 1.2em;border-bottom:1px solid var(--linha);background:var(--papel-alto);}
  .mtto-article figure{margin:2em 0;}
  .mtto-article figure img{max-width:100%;height:auto;display:block;border-radius:4px;}
  .mtto-article figcaption{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--tinta-fraca);margin-top:0.7em;text-align:center;}
  .mtto-article hr{border:none;border-top:1px solid var(--linha);margin:2.6em 0;}
  .mtto-article table{width:100%;border-collapse:collapse;margin:1.8em 0;font-size:0.9em;}
  .mtto-article th,.mtto-article td{border-bottom:1px solid var(--linha);padding:0.5em 0.8em;text-align:start;}
  .mtto-article th{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;font-size:11px;letter-spacing:0.08em;color:var(--tinta-fraca);}
  .chroma{background:var(--papel-alto);color:var(--sumi);}
  .chroma .k,.chroma .kc,.chroma .kd,.chroma .kn,.chroma .kr,.chroma .kt,.chroma .o,.chroma .ow{color:var(--carimbo);}
  .chroma .s,.chroma .s1,.chroma .s2,.chroma .sb,.chroma .sc,.chroma .sd,.chroma .se,.chroma .sh,.chroma .si,.chroma .sx,.chroma .ss,.chroma .dl{color:var(--ocre);}
  .chroma .c,.chroma .c1,.chroma .cm,.chroma .cs,.chroma .cp,.chroma .cpf,.chroma .ch{color:var(--tinta-fraca);font-style:italic;}
  .chroma .n,.chroma .nx,.chroma .nt,.chroma .na,.chroma .nb,.chroma .nc,.chroma .nf,.chroma .nv,.chroma .no,.chroma .nl{color:var(--sumi);}
  .chroma .m,.chroma .mi,.chroma .mf,.chroma .mh,.chroma .mo,.chroma .il{color:var(--carimbo);}
  .chroma .p{color:var(--tinta-md);}
  .chroma .err{color:var(--carimbo);}
  .chroma .lnt,.chroma .ln{color:var(--tinta-fraca);}
  .chroma .hl{background:rgba(166,57,47,0.12);}
</style>
